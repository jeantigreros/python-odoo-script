name: Build and Release Windows Setup

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.2.3"
        required: true
        type: string

permissions:
  contents: write

env:
  APP_ID: OdooPrinter
  APP_EXE: odoo-epos-bridge.exe
  SERVICE_NAME: OdooPrinter
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build Setup.exe + Velopack feed
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          }
          else {
            $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            Write-Error "Invalid version: $version"
            exit 1
          }
          "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"
          # Single source of truth for the bridge --version + installer name.
          (Get-Content version.py) -replace '__version__ = ".*"', "__version__ = `"$version`"" | Set-Content version.py
          Get-Content version.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        run: |
          $env:ODOO_PRINTER_NO_UPDATE = "1"
          python -m pytest -q

      - name: Build onedir EXE (Velopack-compatible)
        shell: pwsh
        run: |
          python installer/make_version_info.py
          pyinstaller --clean --noconfirm main.spec
          Get-ChildItem dist/odoo-epos-bridge/odoo-epos-bridge.exe

      - name: Optional code signing (self-signed PFX in secrets)
        shell: pwsh
        env:
          SIGN_PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX_B64 }}
          SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGN_PFX_B64)) {
            Write-Host "No signing cert configured, skipping (unsigned test build)."
            exit 0
          }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:SIGN_PFX_B64))
          & signtool sign /f cert.pfx /p $env:SIGN_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            dist/odoo-epos-bridge/odoo-epos-bridge.exe
          Remove-Item cert.pfx -Force

      - name: Install Velopack + Inno Setup
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          choco install innosetup -y

      - name: Velopack pack (auto-update feed)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          vpk pack --packId $env:APP_ID --packVersion $env:VERSION `
            --packDir dist/odoo-epos-bridge --mainExe $env:APP_EXE
          Get-ChildItem Releases/*

      - name: Fetch nssm.exe for the installer payload
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://nssm.cc/release/nssm-2.24.zip" -OutFile nssm.zip
          Expand-Archive nssm.zip nssm_extract -Force
          $exe = Get-ChildItem nssm_extract -Recurse -Filter nssm.exe | Select-Object -First 1
          Copy-Item $exe.FullName installer/nssm.exe -Force

      - name: Build Setup.exe with Inno
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/odoo-printer.iss /DVersion=$env:VERSION
          Get-ChildItem Output/*

      - name: Sign Setup.exe (if cert configured)
        shell: pwsh
        env:
          SIGN_PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX_B64 }}
          SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGN_PFX_B64)) { exit 0 }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:SIGN_PFX_B64))
          & signtool sign /f cert.pfx /p $env:SIGN_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            Output/OdooPrinter-Setup-$env:VERSION.exe
          Remove-Item cert.pfx -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OdooPrinter-${{ steps.version.outputs.VERSION }}
          path: |
            Output/OdooPrinter-Setup-*.exe
            Releases/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: OdooPrinter v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            Output/OdooPrinter-Setup-*.exe
            Releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
