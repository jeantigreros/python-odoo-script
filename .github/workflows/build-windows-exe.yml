name: Build and Release Windows Service

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.2.3"
        required: true
        type: string

permissions:
  contents: write

env:
  APP_NAME: Odoo Printer
  APP_EXE: odoo-epos-bridge.exe
  SERVICE_NAME: OdooPrinter
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build Windows Service Package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          }
          else {
            $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            Write-Error "Invalid version: $version"
            exit 1
          }

          "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }
          python -m pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          if (Test-Path "main.spec") {
            pyinstaller --clean --noconfirm main.spec
          }
          else {
            pyinstaller --clean --noconfirm --onefile --console --name "odoo-epos-bridge" main.py
          }

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -Filter "*.exe" -Recurse | Select-Object -First 1

          if (-not $exe) {
            Write-Error "No EXE was produced in dist/"
            exit 1
          }

          Write-Host "Found EXE: $($exe.FullName)"

      - name: Prepare Windows service package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $packageDir = "service-package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          $exe = Get-ChildItem -Path "dist" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Could not find the built EXE."
            exit 1
          }

          Copy-Item $exe.FullName "$packageDir\${{ env.APP_EXE }}" -Force
          Copy-Item "install_windows_service.ps1" "$packageDir\install_windows_service.ps1" -Force

          if (Test-Path "README.md") {
            Copy-Item "README.md" "$packageDir\README.md" -Force
          }

          $nssmZip = Join-Path $packageDir "nssm.zip"
          Invoke-WebRequest -Uri "https://nssm.cc/release/nssm-2.24.zip" -OutFile $nssmZip

          Expand-Archive -Path $nssmZip -DestinationPath "$packageDir\nssm" -Force
          $nssmExe = Get-ChildItem -Path "$packageDir\nssm" -Recurse -Filter "nssm.exe" | Select-Object -First 1

          if (-not $nssmExe) {
            Write-Error "nssm.exe was not found in the downloaded archive."
            exit 1
          }

          Copy-Item $nssmExe.FullName "$packageDir\nssm.exe" -Force

          @"
          Windows service package for Odoo Printer

          1. Copy the ZIP to the target Windows machine.
          2. Extract it.
          3. Run PowerShell as Administrator.
          4. Execute:
             .\install_windows_service.ps1

          The service uses NSSM to run the bundled EXE in the background.
          "@ | Out-File "$packageDir\INSTALL.txt" -Encoding ascii

          $zipPath = "odoo-printer-windows-$env:VERSION.zip"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath -Force

          Write-Host "Created release bundle: $zipPath"

      - name: Upload service bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: OdooPrinter-Windows-Service-${{ steps.version.outputs.VERSION }}
          path: |
            odoo-printer-windows-${{ steps.version.outputs.VERSION }}.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Odoo Printer v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            odoo-printer-windows-${{ steps.version.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
